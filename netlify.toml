# Netlify 部署配置
# 构建命令与发布目录
[build]
  command = "npm run build"
  publish = "dist"

# 构建时环境变量（Node 版本）
[build.environment]
  NODE_VERSION = "20"

# 重定向规则
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# 安全标头
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
